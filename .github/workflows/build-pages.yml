# Rebuilds the pages after content/ changes (saves from the admin panel at /admin/).
# Runs tools/build_all.py, checks the result, and commits the generated pages to main;
# Vercel then publishes that commit. The wedding invitation (wedding/, فرح/) is never touched:
# the build refuses to write there, and this job fails if anything under those paths changed.
name: Build pages

on:
  push:
    branches: [main]
    paths: ["content/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build, check and commit the pages
        run: |
          git config core.quotepath off
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # if main moved while building (another save, a merge), start over from the new main
          # so the pages always match the newest content
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 tools/build_all.py
            test -z "$(git status --porcelain -- 'wedding/' 'فرح/')"   # red line: wedding invitation untouched
            npm run lint:html
            git add -A -- . ':(exclude)wedding' ':(exclude)فرح'
            # always commit (even with no page change) so the admin panel sees the save was processed
            git commit --allow-empty -m "Rebuild pages from content"
            git push origin HEAD:main && exit 0
          done
          exit 1
